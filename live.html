<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>Live | UNITED ESTIF</title><link rel=stylesheet href=/static/style.css><header><div class=brand>UNITED <span>ESTIF</span></div><nav><a href="/">Home</a><a href=/live>🔴 Live</a><a href=/search>Search</a></nav></header><main><section class=hero><div><small>LIVE CENTER</small><h1>🔴 Live Now</h1><p>Auto-refreshes every 30 seconds.</p></div></section><div id=x class=grid></div></main><script>async function load(){let d=await(await fetch('/api/live')).json();x.innerHTML=d.matches.map(m=>`<article class=card><div class=league>${m.league}</div><div class=teams><div>${m.home}</div><strong>${m.hs} — ${m.aws}</strong><div>${m.away}</div></div><p>Minute: <b>${m.minute}'</b></p><a class=matchlink href="/match/${m.id}">Match center →</a></article>`).join('')||'<div class=card>No live matches.</div>'}load();setInterval(load,30000)</script>
