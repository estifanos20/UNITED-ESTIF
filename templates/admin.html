<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>Admin</title><link rel=stylesheet href=/static/style.css><main><h1>UNITED ESTIF Admin</h1>{% for m in matches %}<form class="card admin" method=post action="/admin/match/{{m.id}}"><b>{{m.home}} vs {{m.away}}</b><select name=status>{% for x in ['SCHEDULED','LIVE','FINISHED','PAUSED'] %}<option {% if m.status==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select><input name=minute value="{{m.minute}}"><input name=hs value="{{m.hs}}"><input name=aws value="{{m.aws}}"><input name=hodd value="{{m.hodd}}"><input name=draw value="{{m.draw}}"><input name=aodd value="{{m.aodd}}"><button>Save match</button></form>{% endfor %}<p>Demo admin controls only.</p></main>
