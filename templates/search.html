<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>Search</title><link rel=stylesheet href=/static/style.css><header><div class=brand>UNITED <span>ESTIF</span></div><nav><a href="/">Home</a><a href=/live>Live</a><a href=/favorites>Favorites</a></nav></header><main><section class=hero><div><small>SEARCH</small><h1>Find a match</h1><form class=search><input name=q value="{{q}}" placeholder="Team or league"><button>Search</button></form></div></section><div class=grid>{% for m in matches %}<article class=card><div class=league>{{m.league}} · {{m.status}}</div><div class=teams><div>{{m.home}}</div><strong>{{m.hs}} — {{m.aws}}</strong><div>{{m.away}}</div></div><a class=matchlink href="/match/{{m.id}}">Open →</a></article>{% else %}<div class=card>No matches found.</div>{% endfor %}</div></main>
